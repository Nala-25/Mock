<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Exam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #F7EAE0;
      color: #5E3122;
      display: flex;
      justify-content: center;
      padding: 20px 10px 80px 10px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(94, 49, 34, 0.08);
      padding: 30px;
      margin-top: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* Start & Finish Screens */
    .screen-center {
      text-align: center;
      padding: 20px 10px;
    }

    .screen-center h1 {
      font-size: 26px;
      margin-bottom: 12px;
      color: #1D4533;
    }

    .screen-center p {
      font-size: 15px;
      color: #5E3122;
      margin-bottom: 24px;
      line-height: 1.5;
      opacity: 0.85;
    }

    .btn {
      background-color: #1D4533;
      color: #F7EAE0;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #5E3122;
    }

    /* Progress & Module Info */
    .module-badge {
      font-size: 12px;
      font-weight: 700;
      color: #1D4533;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .counter {
      font-size: 14px;
      color: #5E3122;
      margin-bottom: 12px;
      opacity: 0.8;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background-color: #F9D2BA;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: #1D4533;
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Question & Choices */
    .question-text {
      font-size: 18px;
      font-weight: 600;
      color: #5E3122;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      background-color: #F7EAE0;
      border: 2px solid #F9D2BA;
      border-radius: 8px;
      font-size: 15px;
      color: #5E3122;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .choice:hover:not(:disabled) {
      background-color: #F9D2BA;
      border-color: #5E3122;
    }

    .choice .letter {
      font-weight: 700;
      color: #1D4533;
      min-width: 20px;
    }

    .choice.correct {
      background-color: #f0fdf4 !important;
      border-color: #22c55e !important;
      color: #15803d !important;
    }

    .choice.correct .letter {
      color: #15803d !important;
    }

    .choice.wrong {
      background-color: #fef2f2 !important;
      border-color: #ef4444 !important;
      color: #b91c1c !important;
    }

    .choice.wrong .letter {
      color: #b91c1c !important;
    }

    /* Feedback Box */
    .feedback {
      display: none;
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .feedback.wrong {
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Bottom Action Area */
    .bottom-action {
      display: flex;
      justify-content: flex-end;
    }

    /* Results */
    .score-card {
      background-color: #F7EAE0;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 24px;
      text-align: center;
      border: 1px solid #F9D2BA;
    }

    .score-val {
      font-size: 42px;
      font-weight: 800;
      color: #1D4533;
      margin-bottom: 4px;
    }

    .stat-row {
      display: flex;
      justify-content: space-around;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #F9D2BA;
      font-size: 14px;
      color: #5E3122;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- START SCREEN -->
    <div id="startScreen" class="screen-center">
      <h1>Mock Exam</h1>
      <p>This exam contains 100 questions randomized <strong>module by module</strong> with shuffled answer options.</p>
      <button class="btn" onclick="startExam()">Start Practice Exam</button>
    </div>

    <!-- EXAM SCREEN -->
    <div id="examScreen" class="hidden">
      <div id="module" class="module-badge">MODULE</div>
      <div id="counter" class="counter">Question 1 of 100</div>
      <div class="progress-bar-bg">
        <div id="progress" class="progress-bar-fill"></div>
      </div>

      <div id="question" class="question-text">Question text goes here...</div>
      <div id="choices" class="choices"></div>

      <div id="feedback" class="feedback"></div>

      <div id="bottomAction" class="bottom-action hidden">
        <button id="nextBtn" class="btn" onclick="nextQuestion()">Next Question →</button>
      </div>
    </div>

    <!-- FINISH SCREEN -->
    <div id="finishScreen" class="screen-center hidden">
      <h1>Exam Completed!</h1>
      <p>Here is your final performance summary:</p>

      <div class="score-card">
        <div id="scoreVal" class="score-val">0%</div>
        <div>First-Try Accuracy</div>
        <div class="stat-row">
          <div><strong>First-Try Correct:</strong> <span id="correctVal">0</span></div>
          <div><strong>Total Attempts:</strong> <span id="attemptsVal">0</span></div>
        </div>
      </div>

      <button class="btn" onclick="startExam()">Retake Exam</button>
    </div>
  </div>

    function shuffleArray(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    let activeQuestions = [];
    let current = 0;
    let attempts = 0;
    let firstTryCorrect = 0;
    let attemptsForThisQuestion = 0;
    let answeredCurrent = false;

    function startExam() {
      // 1. Prepare all question objects with shuffled choices
      const prepared = RAW_QUESTIONS.map(q => {
        const correctLetter = SOURCE_ANSWER_KEY[String(q.id)];
        const correctIdx = correctLetter.charCodeAt(0) - 65;
        const correctText = q.choices[correctIdx];

        return {
          id: q.id,
          module: q.module,
          question: q.question,
          choices: shuffleArray(q.choices),
          correctText: correctText
        };
      });

      // 2. Group questions by module while preserving original module order
      const moduleMap = new Map();
      prepared.forEach(q => {
        if (!moduleMap.has(q.module)) {
          moduleMap.set(q.module, []);
        }
        moduleMap.get(q.module).push(q);
      });

      // 3. Shuffle questions *within* each module section
      activeQuestions = [];
      moduleMap.forEach((moduleQuestions) => {
        const shuffledModuleQuestions = shuffleArray(moduleQuestions);
        activeQuestions.push(...shuffledModuleQuestions);
      });

      current = 0;
      attempts = 0;
      firstTryCorrect = 0;
      attemptsForThisQuestion = 0;
      answeredCurrent = false;

      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('finishScreen').classList.add('hidden');
      document.getElementById('examScreen').classList.remove('hidden');
      document.getElementById('bottomAction').classList.add('hidden');

      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderQuestion() {
      const q = activeQuestions[current];
      answeredCurrent = false;
      attemptsForThisQuestion = 0;

      document.getElementById('module').textContent = q.module || '';
      document.getElementById('counter').textContent = `Question ${current + 1} of ${activeQuestions.length}`;
      document.getElementById('progress').style.width = `${(current / activeQuestions.length) * 100}%`;
      document.getElementById('question').textContent = `${current + 1}. ${q.question}`;

      const choicesContainer = document.getElementById('choices');
      choicesContainer.innerHTML = '';

      ['A', 'B', 'C', 'D'].forEach((letter, index) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'choice';

        const letterSpan = document.createElement('span');
        letterSpan.className = 'letter';
        letterSpan.textContent = letter;

        const textSpan = document.createElement('span');
        textSpan.textContent = q.choices[index];

        button.appendChild(letterSpan);
        button.appendChild(textSpan);

        button.onclick = () => selectAnswer(q.choices[index], button);

        choicesContainer.appendChild(button);
      });

      const feedback = document.getElementById('feedback');
      feedback.className = 'feedback';
      feedback.innerHTML = '';

      document.getElementById('bottomAction').classList.add('hidden');
    }

    function selectAnswer(selectedChoiceText, selectedButton) {
      if (answeredCurrent) return;

      attempts++;
      attemptsForThisQuestion++;

      const q = activeQuestions[current];
      const buttons = document.querySelectorAll('.choice');
      const isCorrect = selectedChoiceText.trim().toLowerCase() === q.correctText.trim().toLowerCase();

      buttons.forEach(btn => btn.disabled = true);

      const feedback = document.getElementById('feedback');
      const bottomAction = document.getElementById('bottomAction');
      const nextBtn = document.getElementById('nextBtn');

      if (isCorrect) {
        answeredCurrent = true;
        if (attemptsForThisQuestion === 1) firstTryCorrect++;

        selectedButton.classList.add('correct');
        feedback.className = 'feedback show correct';
        feedback.innerHTML = `
          <div class="feedback-title">✓ Correct!</div>
          <div>You selected the correct answer.</div>
          <div class="correct-answer"><strong>Answer:</strong> ${escapeHtml(q.correctText)}</div>
        `;

        nextBtn.textContent = current === activeQuestions.length - 1 ? 'Finish Exam →' : 'Next Question →';
        bottomAction.classList.remove('hidden');

        document.getElementById('progress').style.width = `${((current + 1) / activeQuestions.length) * 100}%`;
      } else {
        selectedButton.classList.add('wrong');

        buttons.forEach(btn => {
          if (btn.children[1].textContent.trim().toLowerCase() === q.correctText.trim().toLowerCase()) {
            btn.classList.add('correct');
          }
        });

        feedback.className = 'feedback show wrong';
        feedback.innerHTML = `
          <div class="feedback-title">✗ Incorrect</div>
          <div class="correct-answer"><strong>Correct Answer:</strong> ${escapeHtml(q.correctText)}</div>
        `;

        setTimeout(() => {
          buttons.forEach(btn => btn.disabled = false);
        }, 400);
      }
    }

    function nextQuestion() {
      if (!answeredCurrent) return;

      if (current < activeQuestions.length - 1) {
        current++;
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        finishExam();
      }
    }

    function finishExam() {
      document.getElementById('examScreen').classList.add('hidden');
      document.getElementById('bottomAction').classList.add('hidden');
      document.getElementById('finishScreen').classList.remove('hidden');

      const pct = Math.round((firstTryCorrect / activeQuestions.length) * 100);
      document.getElementById('scoreVal').textContent = `${pct}%`;
      document.getElementById('correctVal').textContent = `${firstTryCorrect} / ${activeQuestions.length}`;
      document.getElementById('attemptsVal').textContent = attempts;

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
